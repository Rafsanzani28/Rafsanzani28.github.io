<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Profil Rapsan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #805304;
      margin: 0;
      padding: 30px;
    }
    .profile {
      background: #ffe8c6;
      padding: 30px;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .profile img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
    }
    .info {
      margin-top: 15px;
    }
    .info h2 {
      margin: 10px 0 5px;
    }
    .info p {
      margin: 5px 0;
      color: #555;
    }
    .social {
      margin-top: 20px;
    }
    .social a {
      display: inline-block;
      margin: 0 10px;
      text-decoration: none;
      font-size: 24px;
      color: #333;
      transition: 1s;
    }
    .social a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="profile">
    <!-- Orang Kece -->
    <img src="rapsan.jpg" alt="Foto Mahasiswa">

    <!-- Info info -->
    <div class="info">
      <h2>Muhammad Rafsanzani</h2>
      <p>NIM: 102022400128</p>
      <p>Fakultas: Rekayasa Industri</p>
      <p>Program Studi: Sistem Informasi</p>
    </div>

    <!-- ling lung -->
    <div class="social">
      <a href="https://github.com/new" target="_blank">GitHub</a>
      <a href="https://www.instagram.com/rfs_annn/" target="_blank">IG</a>
    </div>
  </div>
</body>
</html>
